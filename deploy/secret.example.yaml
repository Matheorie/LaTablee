# Modèle uniquement, avec des valeurs factices. Ne jamais y mettre de vraies valeurs.
# Le vrai Secret est créé hors Git par create_secrets.ps1 (local) ou par la CI.
apiVersion: v1
kind: Secret
metadata:
  name: app.secrets
  namespace: latablee
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: change-me-admin
  USERS_DB_PASSWORD: change-me-users
  MEALS_DB_PASSWORD: change-me-meals
  BOOKINGS_DB_PASSWORD: change-me-bookings
  ACCOUNTS_DB_PASSWORD: change-me-accounts
  JWT_SECRET: change-me-with-a-long-random-string
