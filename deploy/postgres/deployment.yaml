apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: latablee
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.6-alpine
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: app.secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app.secrets, key: POSTGRES_PASSWORD }
            - name: USERS_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app.secrets, key: USERS_DB_PASSWORD }
            - name: MEALS_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app.secrets, key: MEALS_DB_PASSWORD }
            - name: BOOKINGS_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app.secrets, key: BOOKINGS_DB_PASSWORD }
            - name: ACCOUNTS_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app.secrets, key: ACCOUNTS_DB_PASSWORD }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pgdata
        - name: init
          configMap:
            name: postgres.init
            defaultMode: 0755
