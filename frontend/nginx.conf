server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy : /api/<service>/ est redirigé vers http://<service>:8000/.
    # Les noms DNS sont identiques dans Docker Compose et dans Kubernetes.
    location /api/users/    { proxy_pass http://users:8000/; }
    location /api/meals/    { proxy_pass http://meals:8000/; }
    location /api/bookings/ { proxy_pass http://bookings:8000/; }
    location /api/accounts/ { proxy_pass http://accounts:8000/; }

    # Application monopage : toute autre route renvoie index.html.
    location / {
        try_files $uri /index.html;
    }
}
